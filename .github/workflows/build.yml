name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      # On the very first push the "builds" branch does not exist yet and checking it out would
      # fail the whole run, so look for it first.
      - name: Check for builds branch
        id: builds_branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" builds >/dev/null 2>&1 \
             || git -C "$GITHUB_WORKSPACE/src" ls-remote --exit-code --heads origin builds >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout builds
        if: steps.builds_branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Create orphan builds branch
        if: steps.builds_branch.outputs.exists != 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/builds"
          cd "$GITHUB_WORKSPACE/builds"
          git init -q
          git checkout -q --orphan builds
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test core logic (core-test)
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew -p core-test test 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE/src
          ./gradlew make makePluginsJson 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if git rev-parse --verify -q HEAD >/dev/null; then
            git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          else
            git commit -m "Build $GITHUB_SHA"
          fi
          # Token in a one-off header, never in the remote URL or .git/config.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.https://github.com/.extraheader= \
              -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
              push --force origin HEAD:refs/heads/builds

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          if [ ! -f build.log ]; then echo "No build.log was produced before the failure." > build.log; fi
          rm -rf "$RUNNER_TEMP/build-logs"
          mkdir -p "$RUNNER_TEMP/build-logs"
          cp build.log "$RUNNER_TEMP/build-logs/build.log"
          cd "$RUNNER_TEMP/build-logs"
          git init -q
          git checkout -q --orphan build-logs
          git add build.log
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git commit -q -m "Build log for $GITHUB_SHA"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.https://github.com/.extraheader= \
              -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
              push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/build-logs
